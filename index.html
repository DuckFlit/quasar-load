<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: #fff;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- ФОН ---------- */
  .bg-slide {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    z-index: 0;
  }
  .bg-slide.active { opacity: 1; }

  /* Затемнение поверх фона */
  .bg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, var(--overlay-darkness, 0.4));
    z-index: 1;
  }

  /* ---------- YouTube видео ---------- */
  .youtube-container {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
  }
  .youtube-container iframe {
    width: 100vw;
    height: 56.25vw;
    min-height: 100vh;
    pointer-events: none;
  }

  /* ---------- КОНТЕНТ ---------- */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 40px;
  }

  .server-name {
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }

  .map-name {
    font-size: clamp(14px, 2vw, 22px);
    font-weight: 300;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  .status-text {
    margin-top: 24px;
    font-size: clamp(12px, 1.5vw, 16px);
    font-weight: 300;
    opacity: 0.5;
    max-width: 600px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- ПРОГРЕСС-БАР ---------- */
  .progress-wrapper {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 3;
    padding: 20px 40px 30px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.6;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent, #6c8aff), var(--accent2, #a855f7));
    border-radius: 4px;
    transition: width 0.4s ease;
    box-shadow: 0 0 12px var(--accent, #6c8aff);
  }

  /* ---------- АУДИО ---------- */
  audio { display: none; }

  /* ---------- Мигающие точки ---------- */
  .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }
</style>
</head>
<body>

<!-- Фоновые слайды (генерируются из конфига) -->
<div id="bg-container"></div>

<!-- Затемнение -->
<div class="bg-overlay"></div>

<!-- YouTube (если нет картинок) -->
<div class="youtube-container" id="yt-container" style="display:none;"></div>

<!-- Основной контент -->
<div class="content">
  <div class="server-name" id="server-name">Загрузка...</div>
  <div class="map-name" id="map-name"></div>
  <div class="status-text" id="status-text">Подключение к серверу</div>
</div>

<!-- Прогресс -->
<div class="progress-wrapper">
  <div class="progress-label">
    <span id="progress-percent">0%</span>
    <span id="progress-file"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<!-- Музыка -->
<audio id="bg-music" loop></audio>

<script>
/* ============================================================
   НАСТРОЙКИ — РЕДАКТИРУЙ ЗДЕСЬ
   ============================================================ */
const CONFIG = {

  // Название сервера (если сервер не передаст своё)
  serverName: "QUASAR | ВСПЫШКА ВИРУСА REVIVAL",

  // Музыка: прямая ссылка на mp3/ogg. Пустая строка = без музыки.
  musicUrl: "https://audio.jukehost.co.uk/59a662cd-40b0-11f1-a012-fa163edb0845",
  // Пример: "https://example.com/music.mp3"

  // Громкость музыки: от 0.0 до 1.0
  musicVolume: 0.1,

  // Картинки фона (прямые ссылки, любое количество).
  // Если пусто — будет показано YouTube видео ниже.
  images: [
    // "https://example.com/image1.jpg",
    // "https://example.com/image2.jpg",
    // "https://example.com/image3.jpg",
  ],

  // Интервал смены картинок (секунды)
  slideshowInterval: 8,

  // Затемнение фона: 0.0 = нет, 1.0 = полностью чёрный
  overlayDarkness: 0.4,

  // YouTube видео ID (показывается если нет картинок).
  // Например: "dQw4w9WgXcQ" из ссылки youtube.com/watch?v=dQw4w9WgXcQ
  // Пустая строка = просто чёрный фон.
  youtubeVideoId: "hDOueDT1cB0",

  // Цвета акцента прогресс-бара
  accentColor: "#6c8aff",
  accentColor2: "#a855f7",
};

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

// Применяем цвета
document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
document.documentElement.style.setProperty('--accent2', CONFIG.accentColor2);
document.documentElement.style.setProperty('--overlay-darkness', CONFIG.overlayDarkness);

// Имя сервера по умолчанию
document.getElementById('server-name').textContent = CONFIG.serverName;

// ---------- ФОН: картинки или YouTube ----------
let slides = [];
let currentSlide = 0;

if (CONFIG.images.length > 0) {
  const container = document.getElementById('bg-container');
  CONFIG.images.forEach((url, i) => {
    const div = document.createElement('div');
    div.className = 'bg-slide' + (i === 0 ? ' active' : '');
    div.style.backgroundImage = `url('${url}')`;
    container.appendChild(div);
    slides.push(div);
  });
  // Слайдшоу
  if (slides.length > 1) {
    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, CONFIG.slideshowInterval * 1000);
  }
} else if (CONFIG.youtubeVideoId) {
  const yt = document.getElementById('yt-container');
  yt.style.display = 'flex';
  yt.innerHTML = `
    <iframe src="https://www.youtube.com/embed/${CONFIG.youtubeVideoId}?autoplay=1&mute=1&loop=1&playlist=${CONFIG.youtubeVideoId}&controls=0&showinfo=0&rel=0&modestbranding=1"
      frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}

// ---------- МУЗЫКА ----------
if (CONFIG.musicUrl) {
  const audio = document.getElementById('bg-music');
  audio.src = CONFIG.musicUrl;
  audio.volume = CONFIG.musicVolume;
  // Автовоспроизведение при первом клике (политика браузеров)
  const tryPlay = () => audio.play().catch(() => {});
  tryPlay();
  document.addEventListener('click', tryPlay);
  document.addEventListener('keydown', tryPlay);
}

// ---------- ПРОГРЕСС ----------
let totalFiles = 0;
let neededFiles = 0;

function updateProgress(percent) {
  const p = Math.min(100, Math.max(0, Math.round(percent)));
  document.getElementById('progress-fill').style.width = p + '%';
  document.getElementById('progress-percent').textContent = p + '%';
}

/* ============================================================
   ФУНКЦИИ, КОТОРЫЕ ВЫЗЫВАЕТ ДВИЖОК GMOD
   ============================================================ */

// Вызывается при получении деталей сервера
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
  if (servername) {
    document.getElementById('server-name').textContent = servername;
  }
  if (mapname) {
    document.getElementById('map-name').textContent = mapname;
  }
}

// Изменение статуса загрузки
function SetStatusChanged(status) {
  const el = document.getElementById('status-text');
  el.innerHTML = status + '<span class="dots"></span>';
}

// Скачивается конкретный файл
function DownloadingFile(filename) {
  document.getElementById('progress-file').textContent = filename;
}

// Общее количество файлов
function SetFilesTotal(total) {
  totalFiles = total;
}

// Сколько файлов осталось
function SetFilesNeeded(needed) {
  neededFiles = needed;
  if (totalFiles > 0) {
    const percent = ((totalFiles - needed) / totalFiles) * 100;
    updateProgress(percent);
  }
}

// ---------- Фоллбэк: парсим параметры из URL ----------
(function() {
  const params = new URLSearchParams(window.location.search);
  const s = params.get('s'); // server name
  const m = params.get('m'); // map name
  const l = params.get('l'); // load percent
  if (s) document.getElementById('server-name').textContent = s;
  if (m) document.getElementById('map-name').textContent = m;
  if (l) updateProgress(parseFloat(l));
})();
</script>
</body>
</html>
