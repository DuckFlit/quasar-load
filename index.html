<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: #fff;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- ФОН ---------- */
  .bg-slide {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    z-index: 0;
  }
  .bg-slide.active { opacity: 1; }

  .bg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, var(--overlay-darkness, 0.4));
    z-index: 1;
  }

  /* ---------- ПРЯМОЕ ВИДЕО (mp4/webm) ---------- */
  #bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- YouTube ---------- */
  .youtube-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  #yt-frame {
    position: absolute;
    top: 50%; left: 50%;
    width: 214vh;
    height: 120.4vh;
    min-width: 100vw;
    min-height: 67.5vw;
    transform: translate(-50%, -50%);
    border: 0;
    pointer-events: none;
  }
  .yt-blocker { position: absolute; inset: 0; z-index: 1; }
  .yt-curtain {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: #0a0a0f;
    opacity: 1;
    transition: opacity 1.2s ease;
  }

  /* ---------- КОНТЕНТ ---------- */
  .content {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 40px;
  }

  .server-name {
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }

  .map-name {
    font-size: clamp(14px, 2vw, 22px);
    font-weight: 300;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  /* ---------- ЭТАПЫ (уменьшенные) ---------- */
  .stages {
    display: flex;
    gap: 4px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 600px;
  }
  .stage {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 3px;
    background: rgba(255,255,255,0.04);
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.25;
    transition: all 0.4s ease;
  }
  .stage .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s;
  }
  .stage.active {
    opacity: 0.9;
    background: rgba(255,255,255,0.08);
  }
  .stage.active .dot {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }
  .stage.done { opacity: 0.45; }
  .stage.done .dot { background: #4ade80; }

  /* ---------- СТАТУС-СТРОКА ---------- */
  .status-text {
    margin-top: 14px;
    font-family: Consolas, Monaco, monospace;
    font-size: clamp(10px, 1.3vw, 13px);
    opacity: 0.5;
    max-width: 700px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  body.is-ready .dots { display: none; }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }

  /* ---------- ПАНЕЛЬ С ИНФОЙ ---------- */
  .info-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 180px;
  }
  .info-card {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 10px;
  }
  .info-card-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.4;
    margin-bottom: 4px;
  }
  .info-card-content {
    font-size: 11px;
    opacity: 0.85;
    word-break: break-word;
  }
  .info-card-content a {
    color: var(--accent);
    text-decoration: none;
  }
  .qr-code {
    width: 100%;
    margin-top: 6px;
    border-radius: 4px;
    background: #fff;
  }

  /* ---------- ПРОГРЕСС-БАР ---------- */
  .progress-wrapper {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 4;
    padding: 20px 40px 30px;
  }
  .progress-label {
    display: flex;
    gap: 16px;
    align-items: baseline;
    font-family: Consolas, Monaco, monospace;
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  #progress-percent { min-width: 38px; }
  #progress-file {
    flex: 1;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0.65;
    font-size: 10px;
  }
  #progress-files { min-width: 65px; text-align: right; }

  .progress-track {
    width: 100%;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent, #6c8aff), var(--accent2, #a855f7));
    border-radius: 3px;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px var(--accent, #6c8aff);
  }
  body.is-ready .progress-fill {
    background: linear-gradient(90deg, #22c55e, #4ade80);
    box-shadow: 0 0 12px #22c55e;
  }

  audio { display: none; }
</style>
</head>
<body>

<div id="bg-container"></div>
<video id="bg-video" muted loop playsinline style="display:none;"></video>
<div class="bg-overlay"></div>

<div class="youtube-container" id="yt-container" style="display:none;">
  <iframe id="yt-frame" src="" allow="autoplay; encrypted-media"></iframe>
  <div class="yt-blocker"></div>
  <div class="yt-curtain" id="yt-curtain"></div>
</div>

<div class="content">
  <div class="server-name" id="server-name">Загрузка...</div>
  <div class="map-name" id="map-name"></div>
  <div class="stages" id="stages"></div>
  <div class="status-text"><span id="status-line">Подключение к серверу</span><span class="dots"></span></div>
</div>

<!-- ПАНЕЛЬ С ИНФОЙ -->
<div class="info-panel">
  <div class="info-card">
    <div class="info-card-label">Discord</div>
    <div class="info-card-content">
      <a href="https://discord.gg/9tn6QVEeHW" target="_blank">discord.gg/9tn6QVEeHW</a>
    </div>
    <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fdiscord.gg%2F9tn6QVEeHW&bgcolor=ffffff&color=0a0a0f" alt="QR Code">
  </div>
</div>

<div class="progress-wrapper">
  <div class="progress-label">
    <span id="progress-percent">0%</span>
    <span id="progress-file"></span>
    <span id="progress-files"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<audio id="bg-music" loop></audio>

<script>
/* ============================================================
   НАСТРОЙКИ — РЕДАКТИРУЙ ЗДЕСЬ
   ============================================================ */
const CONFIG = {

  serverName: "QUASAR | ВСПЫШКА ВИРУСА REVIVAL",

  musicUrl: "https://nu.vgmtreasurechest.com/soundtracks/call-of-duty-modern-warfare-2019-original-game-soundtrack/bvzjypdy/02%20-%20Piccadilly%20Circus.mp3",
  musicVolume: 0.1,

  // Прямая ссылка на видео (mp4/webm). Приоритетнее YouTube!
  // Пример: "https://example.com/video.mp4"
  videoUrl: "https://files.catbox.moe/tf2bvf.mp4",

  images: [
    // "https://example.com/image1.jpg",
  ],

  slideshowInterval: 8,
  overlayDarkness: 0.4,
  youtubeVideoId: "hDOueDT1cB0",

  accentColor: "#6c8aff",
  accentColor2: "#a855f7",
};

/* ============================================================
   ЭТАПЫ ЗАГРУЗКИ
   ============================================================ */
const STAGES = [
  'Подключение',
  'Карта',
  'Workshop',
  'Файлы',
  'Lua',
  'Готово',
];

const STAGE_MATCHERS = [
  [5, /ready|готов|done|complete|finish|fully/i],
  [2, /workshop|мастерск|addon/i],
  [4, /lua|script/i],
  [3, /download|file|файл|sound|model|material/i],
  [1, /world|map|карт|precach|loading|загруз/i],
  [0, /connect|join|retriev|подключ|server info/i],
];

let stageIndex = 0;
const stageEls = [];
const stagesBox = document.getElementById('stages');

STAGES.forEach(label => {
  const el = document.createElement('div');
  el.className = 'stage';
  el.innerHTML = '<span class="dot"></span>' + label;
  stagesBox.appendChild(el);
  stageEls.push(el);
});

function renderStages() {
  stageEls.forEach((el, i) => {
    el.classList.toggle('done',   i <  stageIndex);
    el.classList.toggle('active', i === stageIndex);
  });
}

function setStage(i) {
  if (i > stageIndex) {
    stageIndex = i;
    renderStages();
    if (i === 5) markReady();
  }
}

function detectStage(status) {
  for (const [idx, re] of STAGE_MATCHERS) {
    if (re.test(status)) { setStage(idx); break; }
  }
}

function markReady() {
  document.body.classList.add('is-ready');
  updateProgress(100);
}

renderStages();

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
document.documentElement.style.setProperty('--accent2', CONFIG.accentColor2);
document.documentElement.style.setProperty('--overlay-darkness', CONFIG.overlayDarkness);
document.getElementById('server-name').textContent = CONFIG.serverName;

// ---------- ФОН: ПРИОРИТЕТ ----------
// 1. Прямое видео (videoUrl)
// 2. YouTube (youtubeVideoId)
// 3. Картинки (images)
// 4. Ничего (просто чёрный фон + overlay)

let slides = [];
let currentSlide = 0;

if (CONFIG.videoUrl) {
  // Прямое видео
  const video = document.getElementById('bg-video');
  video.src = CONFIG.videoUrl;
  video.style.display = 'block';
  video.play().catch(() => {});
} else if (CONFIG.youtubeVideoId) {
  // YouTube
  const yt = document.getElementById('yt-container');
  yt.style.display = 'block';
  document.getElementById('yt-frame').src =
    'https://www.youtube.com/embed/' + CONFIG.youtubeVideoId +
    '?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&loop=1' +
    '&playlist=' + CONFIG.youtubeVideoId +
    '&iv_load_policy=3&disablekb=1&fs=0&modestbranding=1';

  setTimeout(() => {
    document.getElementById('yt-curtain').style.opacity = '0';
  }, 2500);
} else if (CONFIG.images.length > 0) {
  // Картинки
  const container = document.getElementById('bg-container');
  CONFIG.images.forEach((url, i) => {
    const div = document.createElement('div');
    div.className = 'bg-slide' + (i === 0 ? ' active' : '');
    div.style.backgroundImage = `url('${url}')`;
    container.appendChild(div);
    slides.push(div);
  });
  if (slides.length > 1) {
    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, CONFIG.slideshowInterval * 1000);
  }
}

// ---------- МУЗЫКА ----------
if (CONFIG.musicUrl) {
  const audio = document.getElementById('bg-music');
  audio.volume = CONFIG.musicVolume;
  audio.src = CONFIG.musicUrl;

  const applyVol = () => { audio.volume = CONFIG.musicVolume; };
  audio.addEventListener('loadedmetadata', applyVol);
  audio.addEventListener('play', applyVol);

  const tryPlay = () => { applyVol(); audio.play().catch(() => {}); };
  tryPlay();
  document.addEventListener('click', tryPlay);
  document.addEventListener('keydown', tryPlay);
}

// ---------- ПРОГРЕСС ----------
let totalFiles = 0;

function updateProgress(percent) {
  const p = Math.min(100, Math.max(0, Math.round(percent)));
  document.getElementById('progress-fill').style.width = p + '%';
  document.getElementById('progress-percent').textContent = p + '%';
}

/* ============================================================
   GMOD FUNCTIONS
   ============================================================ */
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language, gamemodeNice) {
  if (servername) document.getElementById('server-name').textContent = servername;
  if (mapname) {
    document.getElementById('map-name').textContent =
      mapname + (gamemodeNice ? ' • ' + gamemodeNice : '');
  }
  setStage(1);
}

function SetStatusChanged(status) {
  document.getElementById('status-line').textContent = status;
  detectStage(status);
}

function DownloadingFile(filename) {
  document.getElementById('progress-file').textContent = filename;
  setStage(3);
}

function SetFilesTotal(total) {
  totalFiles = total;
  if (total > 0) setStage(3);
}

function SetFilesNeeded(needed) {
  if (totalFiles > 0) {
    document.getElementById('progress-files').textContent =
      (totalFiles - needed) + ' / ' + totalFiles;
    updateProgress(((totalFiles - needed) / totalFiles) * 100);
  }
}

// ---------- ДЕМО ----------
(function() {
  const params = new URLSearchParams(window.location.search);
  const s = params.get('s');
  const m = params.get('m');
  const l = params.get('l');
  if (s) document.getElementById('server-name').textContent = s;
  if (m) document.getElementById('map-name').textContent = m;
  if (l) updateProgress(parseFloat(l));

  if (params.get('demo')) {
    const S = (ms, f) => setTimeout(f, ms);
    const files = [
      'materials/quasar/wall_dark.vtf',
      'models/quasar/zombie.mdl',
      'sound/quasar/ambient_wind.wav',
      'materials/quasar/floor_concrete.vtf',
    ];
    S(600,  () => GameDetails(CONFIG.serverName, '', 'rp_quasar_city', 24, 0, 'darkrp', 1, 'ru', 'DarkRP'));
    S(1400, () => SetStatusChanged('Loading world...'));
    S(2600, () => { SetStatusChanged('Downloading workshop item...'); SetFilesTotal(8); SetFilesNeeded(8); });
    files.forEach((f, i) =>
      S(3400 + i * 1100, () => { DownloadingFile(f); SetFilesNeeded(8 - (i + 1) * 2); })
    );
    S(8200, () => SetStatusChanged('Starting Lua...'));
    S(9800, () => SetStatusChanged('Ready to play'));
  }
})();
</script>
</body>
</html>
